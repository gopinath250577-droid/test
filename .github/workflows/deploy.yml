name: Build and Deploy to K3s

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t gopinathtask/hello-nginx:latest .

      - name: Push Docker Image
        run: |
          docker push gopinathtask/hello-nginx:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.TEST }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Cluster Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to K3s
        run: |
          kubectl apply -f kubernetes/

      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment hello-nginx

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/hello-nginx --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc
